name: iOS

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Swift packages (GoogleSignIn) are kept between runs.
      - uses: actions/cache@v4
        with:
          path: build/dd/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'DarseQuran.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and test (Debug)
        run: >-
          set -o pipefail &&
          xcodebuild -project DarseQuran.xcodeproj -scheme DarseQuran
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO test | tee build/test.log

      # The production build compiles (no signing): catches Release-only code paths.
      - name: Build Release
        run: >-
          set -o pipefail &&
          xcodebuild -project DarseQuran.xcodeproj -scheme DarseQuran -configuration Release
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            build/test.log
            build/dd/Logs/Test/
          retention-days: 7

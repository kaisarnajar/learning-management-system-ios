name: DarseQuran
options:
  bundleIdPrefix: com.darsequran
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  DarseQuran:
    type: application
    platform: iOS
    sources:
      - path: DarseQuran
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: GoogleSignIn
    settings:
      base:
        PRODUCT_NAME: DarseQuran
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DarseQuran/Info.plist
    info:
      path: DarseQuran/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The launch screen is green: light status bar text until the app sets its own.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - amiri_regular.ttf
          - amiri_bold.ttf
          - poppins_regular.ttf
          - poppins_medium.ttf
          - poppins_semibold.ttf
          - sourceserif4.ttf
          - sourceserif4_italic.ttf
        # Apps that pay a upi:// link (Android asks the same through <queries>). Without an installed one the
        # pay step shows the UPI ID, bank details and QR code instead.
        LSApplicationQueriesSchemes:
          - upi
          - phonepe
          - tez
          - gpay
          - paytmmp
          - bhim
          - credpay
        NSCameraUsageDescription: Take a photo of your payment receipt to attach it as proof.
        NSPhotoLibraryUsageDescription: Choose a payment screenshot or profile photo to upload.
        CFBundleURLTypes:
          - CFBundleURLName: com.darsequran.academy.links
            CFBundleURLSchemes:
              - darsequran
          - CFBundleURLName: com.darsequran.academy.google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        StagingBaseURL: $(STAGING_BASE_URL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)

  DarseQuranTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DarseQuranTests
    dependencies:
      - target: DarseQuran
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: DarseQuranTests
        PRODUCT_BUNDLE_IDENTIFIER: com.darsequran.academy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DarseQuran.app/DarseQuran
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  DarseQuran:
    build:
      targets:
        DarseQuran: all
        DarseQuranTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DarseQuranTests
    archive:
      config: Release
